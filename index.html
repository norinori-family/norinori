<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ノリと勢い!! ノリノリ同好会 (皆 family🥴)</title>
  <style>
    :root {
      --primary: #5865F2;
      --accent: #FF007F;
      --bg: #0f0f13;
      --card-bg: #1a1a24;
      --text: #ffffff;
      --text-sub: #b9bbbe;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Helvetica Neue', Arial, sans-serif;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      text-align: center;
      padding: 20px;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 40px 20px;
    }
    .tag {
      background: linear-gradient(45deg, var(--accent), #7928CA);
      color: #fff;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 0.9rem;
      font-weight: bold;
      display: inline-block;
      margin-bottom: 15px;
    }
    h1 {
      font-size: 2.2rem;
      font-weight: 800;
      margin-bottom: 10px;
      background: linear-gradient(90deg, #00f2fe, #4facfe);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p.subtitle {
      color: var(--text-sub);
      font-size: 1.1rem;
      margin-bottom: 30px;
    }
    .features {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      margin: 40px 0;
    }
    .feature-card {
      background-color: var(--card-bg);
      padding: 25px 20px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }
    .feature-card div {
      font-size: 2rem;
      margin-bottom: 10px;
    }
    .feature-card h3 {
      font-size: 1.2rem;
      margin-bottom: 8px;
    }
    .feature-card p {
      color: var(--text-sub);
      font-size: 0.9rem;
    }
    .cta-section {
      background: linear-gradient(135deg, rgba(88,101,242,0.2), rgba(255,0,127,0.2));
      padding: 30px;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,0.1);
      margin-top: 40px;
    }
    .btn {
      display: inline-block;
      background-color: var(--primary);
      color: #fff;
      font-weight: bold;
      font-size: 1.2rem;
      padding: 16px 40px;
      border-radius: 30px;
      text-decoration: none;
      transition: transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 4px 20px rgba(88,101,242,0.4);
      margin-top: 15px;
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 25px rgba(88,101,242,0.6);
    }
    footer {
      margin-top: 60px;
      color: var(--text-sub);
      font-size: 0.8rem;
    }
  </style>
</head>
<body>

  <div class="container">
    <span class="tag">Discord サーバー</span>
    <h1>ノリと勢い!! ノリノリ同好会<br>(皆 family🥴)</h1>
    <p class="subtitle">GTA5 ＆ 楽しく雑談！ノリ重視でワイワイ遊ぶコミュニティ</p>

    <div class="features">
      <div class="feature-card">
        <div>🚗</div>
        <h3>GTA5オンライン</h3>
        <p>ミッションからドライブ、ネタ企画までみんなで大暴れ！</p>
      </div>
      <div class="feature-card">
        <div>💬</div>
        <h3>雑談＆ボイチャ</h3>
        <p>聞き専OK！日常の雑談から深夜の盛り上がりまで大歓迎。</p>
      </div>
      <div class="feature-card">
        <div>🔰</div>
        <h3>初心者大歓迎</h3>
        <p>「皆 family🥴」だから誰でもすぐに馴染める温かい雰囲気！</p>
      </div>
    </div>

    <div class="cta-section">
      <h2>一緒に盛り上がろう！</h2>
      <p style="color: var(--text-sub); margin-top: 5px;">ノリと勢いで気軽に参加ボタンをタップ！</p>
      <a href="https://discord.com/invite/MJtNEeHzh3?utm_source=disboard&utm_medium=external_directory&utm_campaign=organic_discovery" class="btn" target="_blank">Discordサーバーに参加する</a>
    </div>

    <footer>
      &copy; ノリと勢い!! ノリノリ同好会 All Rights Reserved.
    </footer>
  </div>

</body>
</html>
